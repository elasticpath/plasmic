name: Build Bootstrap Image

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - integration
          - production
        default: production

jobs:
  build-bootstrap:
    name: Build Bootstrap Image
    timeout-minutes: 15
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get currently deployed WAB image
        id: deployed-image
        env:
          CLUSTER_NAME: plasmic-${{ inputs.environment }}
          SERVICE_NAME: plasmic-${{ inputs.environment }}-wab
        run: |
          TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster "$CLUSTER_NAME" \
            --services "$SERVICE_NAME" \
            --query 'services[0].taskDefinition' \
            --output text)

          DEPLOYED_IMAGE=$(aws ecs describe-task-definition \
            --task-definition "$TASK_DEF_ARN" \
            --query 'taskDefinition.containerDefinitions[0].image' \
            --output text)

          echo "::add-mask::$DEPLOYED_IMAGE"
          echo "deployed_image=$DEPLOYED_IMAGE" >> $GITHUB_OUTPUT

      - name: Build and push bootstrap image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: bootstrap-${{ github.run_id }}
          BASE_IMAGE: ${{ steps.deployed-image.outputs.deployed_image }}
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg BASE_IMAGE=$BASE_IMAGE \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -f platform/wab/Dockerfile.bootstrap \
            platform/

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "Bootstrap image pushed: $IMAGE_TAG"

      - name: Summary
        run: |
          echo "### Bootstrap Image Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ steps.build-image.outputs.image }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Update \`tasks/bootstrap/config/${{ inputs.environment == 'production' && 'prod-eu' || inputs.environment }}.tfvars\` with this image tag, then re-run \`terraform apply\` and \`aws ecs run-task\`." >> $GITHUB_STEP_SUMMARY

name: Publish Hostless Packages

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - integration
          - production
        default: integration

jobs:
  publish-hostless:
    name: Build and Run PublishHostless
    timeout-minutes: 45
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get currently deployed WAB image
        id: deployed-image
        env:
          CLUSTER_NAME: plasmic-${{ inputs.environment }}
          SERVICE_NAME: plasmic-${{ inputs.environment }}-wab
        run: |
          echo "::add-mask::$CLUSTER_NAME"
          echo "::add-mask::$SERVICE_NAME"

          # Get task definition from running service
          TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster "$CLUSTER_NAME" \
            --services "$SERVICE_NAME" \
            --query 'services[0].taskDefinition' \
            --output text)

          if [ "$TASK_DEF_ARN" = "None" ] || [ -z "$TASK_DEF_ARN" ]; then
            echo "Error: Could not find running WAB service. Deploy first, then run publish-hostless."
            exit 1
          fi

          # Get image from task definition
          DEPLOYED_IMAGE=$(aws ecs describe-task-definition \
            --task-definition "$TASK_DEF_ARN" \
            --query 'taskDefinition.containerDefinitions[0].image' \
            --output text)

          echo "::add-mask::$DEPLOYED_IMAGE"
          echo "deployed_image=$DEPLOYED_IMAGE" >> $GITHUB_OUTPUT
          echo "Using deployed WAB image as base"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'
          cache-dependency-path: platform/canvas-packages/yarn.lock

      - name: Build canvas-packages
        run: |
          cd platform/canvas-packages
          yarn install --frozen-lockfile
          yarn build

      - name: Build and push publish-hostless image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: publish-hostless-${{ github.run_id }}
          BASE_IMAGE: ${{ steps.deployed-image.outputs.deployed_image }}
        run: |
          echo "::add-mask::$ECR_REGISTRY"
          echo "::add-mask::$ECR_REPOSITORY"

          echo "Building publish-hostless image..."

          docker build \
            --platform linux/amd64 \
            --build-arg BASE_IMAGE=$BASE_IMAGE \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -f platform/wab/Dockerfile.publish-hostless \
            platform/

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "Pushed publish-hostless image"

      - name: Register task definition with new image
        id: register-task
        env:
          TASK_FAMILY: plasmic-${{ inputs.environment }}-publish-hostless
          NEW_IMAGE: ${{ steps.build-image.outputs.image }}
        run: |
          echo "::add-mask::$TASK_FAMILY"
          echo "::add-mask::$NEW_IMAGE"

          # Get current task definition
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition "$TASK_FAMILY" \
            --query 'taskDefinition')

          # Update image and remove read-only fields
          NEW_TASK_DEF=$(echo "$TASK_DEF" | jq \
            --arg IMAGE "$NEW_IMAGE" \
            '.containerDefinitions[0].image = $IMAGE |
             del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                 .compatibilities, .registeredAt, .registeredBy)')

          # Register new revision
          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "::add-mask::$NEW_ARN"
          echo "task_definition_arn=$NEW_ARN" >> $GITHUB_OUTPUT
          echo "Registered new task definition revision"

      - name: Run ECS task
        id: run-task
        env:
          CLUSTER_NAME: plasmic-${{ inputs.environment }}
          TASK_DEFINITION: ${{ steps.register-task.outputs.task_definition_arn }}
          SUBNETS: ${{ vars.PRIVATE_SUBNET_IDS }}
          SECURITY_GROUP: ${{ vars.ECS_SECURITY_GROUP_ID }}
        run: |
          echo "::add-mask::$CLUSTER_NAME"
          echo "::add-mask::$SUBNETS"
          echo "::add-mask::$SECURITY_GROUP"

          echo "Starting PublishHostless ECS task..."

          TASK_ARN=$(aws ecs run-task \
            --cluster "$CLUSTER_NAME" \
            --task-definition "$TASK_DEFINITION" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SECURITY_GROUP],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "::add-mask::$TASK_ARN"
          echo "task_arn=$TASK_ARN" >> $GITHUB_OUTPUT
          echo "Task started"

      - name: Wait for task completion
        env:
          CLUSTER_NAME: plasmic-${{ inputs.environment }}
          TASK_ARN: ${{ steps.run-task.outputs.task_arn }}
        run: |
          echo "Waiting for task to complete..."

          aws ecs wait tasks-stopped \
            --cluster "$CLUSTER_NAME" \
            --tasks "$TASK_ARN"

          # Check exit code
          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "$CLUSTER_NAME" \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)

          if [ "$EXIT_CODE" = "0" ]; then
            echo "Task completed successfully!"
          else
            echo "Task failed with exit code: $EXIT_CODE"
            exit 1
          fi

      - name: Task summary
        if: always()
        env:
          TASK_ARN: ${{ steps.run-task.outputs.task_arn }}
        run: |
          echo "### Publish Hostless Task" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Task ARN:** \`$TASK_ARN\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View logs in CloudWatch: \`/ecs/plasmic-${{ inputs.environment }}-publish-hostless\`" >> $GITHUB_STEP_SUMMARY

name: Publish Hostless Packages

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - integration
          - production
        default: integration

jobs:
  publish-hostless:
    name: Trigger Hostless Publishing Task
    timeout-minutes: 30
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4
          terraform_wrapper: false

      - name: Get network config from Terraform
        id: terraform
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          TERRAFORM_STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          # Mask sensitive values
          echo "::add-mask::$TERRAFORM_STATE_BUCKET"

          cd terraform/services/publish-hostless

          terraform init \
            -backend-config="bucket=${TERRAFORM_STATE_BUCKET}" \
            -backend-config="key=${ENVIRONMENT}/services/publish-hostless/terraform.tfstate" \
            -backend-config="use_lockfile=true" \
            -backend-config="region=${AWS_REGION}" \
            -reconfigure

          # Get outputs
          SUBNETS=$(terraform output -raw private_subnet_ids 2>/dev/null || terraform output -json private_subnet_ids | jq -r 'join(",")')
          SECURITY_GROUP=$(terraform output -raw ecs_security_group_id)

          # Mask and export
          echo "::add-mask::$SUBNETS"
          echo "::add-mask::$SECURITY_GROUP"

          echo "subnets=$SUBNETS" >> $GITHUB_OUTPUT
          echo "security_group=$SECURITY_GROUP" >> $GITHUB_OUTPUT

      - name: Run ECS Task
        id: run-task
        env:
          CLUSTER_NAME: plasmic-${{ inputs.environment }}
          TASK_DEFINITION: plasmic-${{ inputs.environment }}-publish-hostless
          SUBNETS: ${{ steps.terraform.outputs.subnets }}
          SECURITY_GROUP: ${{ steps.terraform.outputs.security_group }}
        run: |
          echo "Starting PublishHostless ECS task..."
          echo "Cluster: $CLUSTER_NAME"
          echo "Task Definition: $TASK_DEFINITION"

          TASK_ARN=$(aws ecs run-task \
            --cluster "$CLUSTER_NAME" \
            --task-definition "$TASK_DEFINITION" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SECURITY_GROUP],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "task_arn=$TASK_ARN" >> $GITHUB_OUTPUT
          echo "Task started: $TASK_ARN"

      - name: Wait for task completion
        env:
          CLUSTER_NAME: plasmic-${{ inputs.environment }}
          TASK_ARN: ${{ steps.run-task.outputs.task_arn }}
        run: |
          echo "Waiting for task to complete..."

          aws ecs wait tasks-stopped \
            --cluster "$CLUSTER_NAME" \
            --tasks "$TASK_ARN"

          # Check exit code
          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "$CLUSTER_NAME" \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)

          if [ "$EXIT_CODE" = "0" ]; then
            echo "Task completed successfully!"
          else
            echo "Task failed with exit code: $EXIT_CODE"
            exit 1
          fi

      - name: Task summary
        if: always()
        env:
          TASK_ARN: ${{ steps.run-task.outputs.task_arn }}
        run: |
          echo "### Publish Hostless Task" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Task ARN:** \`$TASK_ARN\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View logs in CloudWatch: \`/ecs/plasmic-${{ inputs.environment }}-publish-hostless\`" >> $GITHUB_STEP_SUMMARY

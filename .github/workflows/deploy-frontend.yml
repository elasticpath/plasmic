name: Deploy Frontend

on:
  workflow_run:
    workflows: ["Deploy to Integration"]
    types:
      - completed
    branches:
      - master
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'integration'
        type: choice
        options:
          - integration
          - production
          - prod-us

jobs:
  deploy-frontend:
    name: Build and Deploy Frontend
    # Run if infrastructure deployment succeeded, manually triggered, or on pull request
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'integration' }}
    permissions:
      contents: read   # Read repo contents
      id-token: write  # Required for AWS OIDC authentication

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          echo "Disk space after cleanup:"
          df -h

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_FRONTEND_DEPLOY_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "yarn"
          cache-dependency-path: platform/wab/yarn.lock

      # deploy-frontend.sh installs the root workspace with pnpm.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Deploy frontend application
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ENVIRONMENT: ${{ github.event.inputs.environment || vars.ENVIRONMENT }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          HOST_URL: ${{ vars.HOST_URL }}
          FRONTEND_CF_ID: ${{ vars.FRONTEND_CF_ID }}
          HOST_CF_ID: ${{ vars.HOST_CF_ID }}
          FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET }}
          HOST_BUCKET: ${{ vars.HOST_BUCKET }}
        run: |
          # Make script executable
          chmod +x .github/scripts/deploy-frontend.sh

          echo "🎨 Deploying frontend application"
          echo "Environment: $ENVIRONMENT"
          echo "Region: $AWS_REGION"
          echo ""

          # Run the deploy-frontend script
          ./.github/scripts/deploy-frontend.sh $ENVIRONMENT

          echo "✅ Frontend deployed successfully!"

      - name: Deployment summary
        if: success()
        run: |
          echo "### ✅ Frontend Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.inputs.environment || vars.ENVIRONMENT }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${GITHUB_SHA:0:8}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed Components:**" >> $GITHUB_STEP_SUMMARY
          echo "- React Studio frontend" >> $GITHUB_STEP_SUMMARY
          echo "- Host files (host.html, popup.html)" >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        run: |
          echo "### ❌ Frontend Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.inputs.environment || vars.ENVIRONMENT }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${GITHUB_SHA:0:8}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the workflow logs for details."

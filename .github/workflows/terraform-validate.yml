name: Terraform Validate

on:
  pull_request:
    paths:
      - 'terraform/**'

jobs:
  validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4

      - name: Validate terraform projects
        run: |
          failed=0

          # Validate projects
          echo "📦 Validating projects..."
          for dir in terraform/projects/*/; do
            project=$(basename "$dir")
            echo "🔍 projects/$project"
            cd "$dir"
            terraform init -backend=false -input=false
            if ! terraform validate; then
              echo "❌ projects/$project failed"
              failed=1
            fi
            cd - > /dev/null
          done

          # Validate services
          echo ""
          echo "🚀 Validating services..."
          for dir in terraform/services/*/; do
            service=$(basename "$dir")
            echo "🔍 services/$service"
            cd "$dir"
            terraform init -backend=false -input=false
            if ! terraform validate; then
              echo "❌ services/$service failed"
              failed=1
            fi
            cd - > /dev/null
          done

          if [ $failed -eq 1 ]; then
            echo ""
            echo "❌ Validation failed"
            exit 1
          fi
          echo ""
          echo "✅ All terraform configurations valid"

      - name: Check terraform formatting
        run: |
          if ! terraform fmt -check -recursive terraform/; then
            echo "❌ Run 'terraform fmt -recursive terraform/' to fix formatting"
            exit 1
          fi
name: Test Platform WAB

on:
  push:
    branches: [master]
    paths:
      - 'platform/wab/**'
      - '.github/workflows/test-wab.yml'
  pull_request:
    branches: [master]
    paths:
      - 'platform/wab/**'
      - '.github/workflows/test-wab.yml'

jobs:
  test:
    name: Jest Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - name: Cache yarn dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Setup PostgreSQL users and extensions
        env:
          PGPASSWORD: postgres
          PGHOST: localhost
          PGUSER: postgres
        run: |
          # Replicates platform/wab/tools/docker-dev/db-setup.bash for CI environment
          # Uses PGPASSWORD, PGHOST, PGUSER env vars for connection

          # Create required database users (same as local setup)
          psql -c "CREATE USER wab PASSWORD 'SEKRET';"
          psql -c "CREATE USER superwab PASSWORD 'SEKRET' CREATEDB CREATEROLE IN GROUP wab;"

          # Grant required permissions for test database creation
          psql -c "GRANT pg_signal_backend TO superwab;"

          # Create wab database (same as local setup)
          psql -c "CREATE DATABASE wab OWNER wab;"

          # Create required extensions (needed for migrations)
          psql -c "CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";"
          psql -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"

          echo "PostgreSQL setup complete (mirrors db-setup.bash)"

      - name: Install root dependencies
        run: yarn install --frozen-lockfile

      - name: Install platform/wab dependencies
        working-directory: platform/wab
        run: yarn install --frozen-lockfile

      - name: Run Jest tests
        working-directory: platform/wab
        env:
          CI: true
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: yarn test

      - name: Test Summary
        if: always()
        run: |
          echo "### Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "All tests passed successfully." >> $GITHUB_STEP_SUMMARY
          else
            echo "Some tests failed. Check the logs for details." >> $GITHUB_STEP_SUMMARY
          fi
name: Deploy to Integration

on:
  push:
    branches:
      - master
    paths:
      - 'platform/wab/**'
      - 'platform/canvas-packages/**'
      - 'platform/loader-bundle-env/**'
      - '.github/**'
  workflow_dispatch:

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: integration
    permissions:
      contents: read   # Read repo contents
      id-token: write  # Required for AWS OIDC authentication

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect canvas-packages changes
        id: canvas-packages-check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          elif git diff --name-only ${{ github.event.before }} ${{ github.sha }} \
                -- platform/canvas-packages/package.json | grep -q .; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Mask ECR registry URL
        run: |
          echo "::add-mask::${{ steps.login-ecr.outputs.registry }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Mask sensitive values
          echo "::add-mask::$ECR_REGISTRY"
          echo "::add-mask::$ECR_REPOSITORY"

          # Build the Docker image
          docker build \
            --platform linux/amd64 \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -f platform/wab/Dockerfile \
            platform/

          # Push to ECR
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          echo "Pushed image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Setup Node.js
        if: steps.canvas-packages-check.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'
          cache-dependency-path: platform/canvas-packages/yarn.lock

      - name: Build canvas-packages
        if: steps.canvas-packages-check.outputs.changed == 'true'
        run: |
          cd platform/canvas-packages
          yarn install --frozen-lockfile
          yarn build

      - name: Build and push publish-hostless image
        id: build-publish-hostless
        if: steps.canvas-packages-check.outputs.changed == 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: publish-hostless-${{ github.run_id }}
          BASE_IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          echo "::add-mask::$ECR_REGISTRY"
          echo "::add-mask::$ECR_REPOSITORY"

          docker build \
            --platform linux/amd64 \
            --build-arg BASE_IMAGE=$BASE_IMAGE \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -f platform/wab/Dockerfile.publish-hostless \
            platform/

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "Pushed publish-hostless image"

      - name: Trigger GitLab deployment
        if: success()
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_API_TOKEN }}
          GITLAB_PROJECT_ID: ${{ secrets.GITLAB_PROJECT_ID }}
          WAB_IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          PH_IMAGE: ${{ steps.build-publish-hostless.outputs.image }}
          CANVAS_CHANGED: ${{ steps.canvas-packages-check.outputs.changed }}
        run: |
          VARS=$(jq -cn \
            --arg wab_image "$WAB_IMAGE" \
            --arg ph_image "$PH_IMAGE" \
            --arg canvas_changed "$CANVAS_CHANGED" \
            '
            [
              {key: "UPDATE_IMAGE_TAGS", value: "true"},
              {key: "TARGET_ENV",        value: "integration"},
              {key: "CONTAINER_IMAGE",   value: $wab_image}
            ]
            + if $canvas_changed == "true" then [
              {key: "PUBLISH_HOSTLESS_IMAGE", value: $ph_image}
            ] else [] end
            ')

          curl --fail --request POST \
            "https://gitlab.elasticpath.com/api/v4/projects/${GITLAB_PROJECT_ID}/pipeline" \
            --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "$(jq -cn --argjson vars "$VARS" '{ref: "main", variables: $vars}')"

      - name: Build summary
        if: success()
        run: |
          echo "### ✅ Docker Image Built and Pushed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ vars.ENVIRONMENT }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tag:** \`${GITHUB_SHA:0:8}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Full SHA:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "GitLab has been notified to deploy this image." >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        run: |
          echo "### ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ vars.ENVIRONMENT }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${GITHUB_SHA:0:8}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the workflow logs for details."

name: Test SDK Packages

on:
  push:
    branches: [master]
    paths:
      - 'packages/**'
      - '.github/workflows/test-packages.yml'
      - 'jest.config.js'
      - 'jest-transform-esbuild.js'
  pull_request:
    branches: [master]
    paths:
      - 'packages/**'
      - '.github/workflows/test-packages.yml'
      - 'jest.config.js'
      - 'jest-transform-esbuild.js'

jobs:
  test:
    name: Jest Tests (packages)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run Jest tests for packages
        env:
          CI: true
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: yarn jest --testPathPattern='packages/' --passWithNoTests

      - name: Test Summary
        if: always()
        run: |
          echo "### SDK Packages Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "All tests passed successfully." >> $GITHUB_STEP_SUMMARY
          else
            echo "Some tests failed. Check the logs for details." >> $GITHUB_STEP_SUMMARY
          fi
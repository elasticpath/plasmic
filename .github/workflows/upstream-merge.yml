name: Upstream Merge

on:
  schedule:
    # Every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    name: Merge upstream/master
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://github.com/plasmicapp/plasmic.git || true
          git fetch upstream master

      - name: Check for new upstream commits
        id: check
        run: |
          UPSTREAM_HEAD=$(git rev-parse upstream/master)
          MERGE_BASE=$(git merge-base HEAD upstream/master)

          if [ "$UPSTREAM_HEAD" = "$MERGE_BASE" ]; then
            echo "No new upstream commits. Nothing to do."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            COMMIT_COUNT=$(git rev-list --count HEAD..$UPSTREAM_HEAD)
            echo "Found $COMMIT_COUNT new upstream commits."
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "commit_count=$COMMIT_COUNT" >> $GITHUB_OUTPUT
          fi

      - name: Attempt merge
        if: steps.check.outputs.has_changes == 'true'
        id: merge
        run: |
          if git merge upstream/master --no-edit; then
            echo "Merge succeeded — no conflicts."
            echo "has_conflicts=false" >> $GITHUB_OUTPUT
          else
            echo "Merge has conflicts."

            # Capture conflicted file list before staging
            CONFLICTED=$(git diff --name-only --diff-filter=U 2>/dev/null)
            echo "conflicted_files<<EOF" >> $GITHUB_OUTPUT
            echo "$CONFLICTED" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT

            # Stage everything (including conflict markers) so we can commit
            git add -A
            git commit --no-edit -m "merge: upstream (conflicts to resolve)" || true
            echo "has_conflicts=true" >> $GITHUB_OUTPUT
          fi

      - name: Build PR description
        if: steps.check.outputs.has_changes == 'true'
        id: pr-body
        env:
          COMMIT_COUNT: ${{ steps.check.outputs.commit_count }}
          HAS_CONFLICTS: ${{ steps.merge.outputs.has_conflicts }}
          CONFLICTED_FILES: ${{ steps.merge.outputs.conflicted_files }}
        run: |
          cat > /tmp/pr-body.md << 'HEREDOC_END'
          ## Upstream Merge
          HEREDOC_END

          echo "" >> /tmp/pr-body.md
          echo "**$COMMIT_COUNT new commits** from [plasmicapp/plasmic](https://github.com/plasmicapp/plasmic) master." >> /tmp/pr-body.md

          if [ "$HAS_CONFLICTS" = "true" ]; then
            cat >> /tmp/pr-body.md << 'HEREDOC_END'

          ### Conflicts to resolve

          This merge has conflicts. Check out the branch, resolve them, and push:

          ```bash
          git fetch origin merge/upstream
          git checkout merge/upstream
          # Resolve conflicts...
          git push origin merge/upstream
          ```

          **Conflicted files:**
          HEREDOC_END
            echo '```' >> /tmp/pr-body.md
            echo "$CONFLICTED_FILES" >> /tmp/pr-body.md
            echo '```' >> /tmp/pr-body.md
          else
            cat >> /tmp/pr-body.md << 'HEREDOC_END'

          ### Clean merge — no conflicts

          This merge applied cleanly. Review the diff and merge when ready.
          HEREDOC_END
          fi

          cat >> /tmp/pr-body.md << 'HEREDOC_END'

          ### Checklist

          See [Upstream Merge Runbook](docs/internal/UPSTREAM_MERGE_RUNBOOK.md) for detailed guidance.

          - [ ] Conflicts resolved (if any)
          - [ ] EP integrity tests pass (`npx jest --testPathPattern=ep-fork-integrity`)
          - [ ] yarn.lock files regenerated for any modified package.json
          - [ ] Mark ready for review (auto-adds CI test labels)
          HEREDOC_END

          echo "body_file=/tmp/pr-body.md" >> $GITHUB_OUTPUT

      - name: Create or update PR
        if: steps.check.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: merge/upstream
          base: master
          title: "merge: upstream ${{ steps.check.outputs.commit_count }} commits"
          body-path: ${{ steps.pr-body.outputs.body_file }}
          labels: upstream-merge

      - name: Summary
        if: always()
        env:
          HAS_CHANGES: ${{ steps.check.outputs.has_changes }}
          COMMIT_COUNT: ${{ steps.check.outputs.commit_count }}
          HAS_CONFLICTS: ${{ steps.merge.outputs.has_conflicts }}
        run: |
          echo "### Upstream Merge" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$HAS_CHANGES" = "false" ]; then
            echo "No new upstream commits. Nothing to do." >> $GITHUB_STEP_SUMMARY
          else
            echo "**Commits:** $COMMIT_COUNT" >> $GITHUB_STEP_SUMMARY
            if [ "$HAS_CONFLICTS" = "true" ]; then
              echo "**Status:** Conflicts detected — PR created for manual resolution" >> $GITHUB_STEP_SUMMARY
            else
              echo "**Status:** Clean merge — PR ready for review" >> $GITHUB_STEP_SUMMARY
            fi
          fi

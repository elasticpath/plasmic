name: Deploy to Production (eu-west-2)

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-push:
    name: Build and Push Docker Image to Quay
    runs-on: ubuntu-latest
    environment: production eu-west-2
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push to Quay
        uses: docker/build-push-action@v5
        with:
          context: platform/
          file: platform/wab/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            quay.io/elasticpath/plasmic-wab:${{ github.ref_name }}
            quay.io/elasticpath/plasmic-wab:latest

      - name: Update GitLab image tag
        if: success()
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_API_TOKEN }}
          GITLAB_PROJECT_ID: ${{ secrets.GITLAB_PROJECT_ID }}
          IMAGE_URL: "quay.io/elasticpath/plasmic-wab:${{ github.ref_name }}"
        run: |
          curl --fail --request POST \
            "https://gitlab.elasticpath.com/api/v4/projects/${GITLAB_PROJECT_ID}/repository/commits" \
            --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "{
              \"branch\": \"main\",
              \"commit_message\": \"chore: update prod-eu image to ${{ github.ref_name }}\",
              \"actions\": [{
                \"action\": \"update\",
                \"file_path\": \"image-tags.yaml\",
                \"content\": \"# image-tags.yaml\n# Updated automatically by GitHub Actions after image push.\n# Do not edit manually — changes will be overwritten on next deploy.\nintegration:\n  container_image: \\\"$(curl -s --header \\\"PRIVATE-TOKEN: ${GITLAB_TOKEN}\\\" \\\"https://gitlab.elasticpath.com/api/v4/projects/${GITLAB_PROJECT_ID}/repository/files/image-tags.yaml/raw?ref=main\\\" | grep -A1 'integration:' | tail -1 | sed 's/.*container_image: //;s/\\\"//g')\\\"\n\nprod-eu:\n  # Images will be pushed to Quay by GitHub Actions on release tag\n  # Format: quay.io/elasticpath/plasmic-{service}:{tag}\n  container_image: \\\"${IMAGE_URL}\\\"\n\"
              }]
            }"

      - name: Build summary
        if: success()
        run: |
          echo "### Docker Image Built and Pushed to Quay" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`quay.io/elasticpath/plasmic-wab:${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "GitLab has been notified to deploy this image to prod-eu." >> $GITHUB_STEP_SUMMARY

  deploy-frontend:
    name: Deploy Frontend to prod-eu
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production eu-west-2
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "yarn"
          cache-dependency-path: platform/wab/yarn.lock

      - name: Deploy frontend application
        env:
          AWS_REGION: eu-west-2
          ENVIRONMENT: prod-eu
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          HOST_URL: ${{ vars.HOST_URL }}
          FRONTEND_CF_ID: ${{ vars.FRONTEND_CF_ID }}
          HOST_CF_ID: ${{ vars.HOST_CF_ID }}
          FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET }}
          HOST_BUCKET: ${{ vars.HOST_BUCKET }}
        run: |
          chmod +x .github/scripts/deploy-frontend.sh
          ./.github/scripts/deploy-frontend.sh prod-eu

      - name: Deployment summary
        if: success()
        run: |
          echo "### Frontend Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** prod-eu" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed Components:**" >> $GITHUB_STEP_SUMMARY
          echo "- React Studio frontend" >> $GITHUB_STEP_SUMMARY
          echo "- Host files (host.html, popup.html)" >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: failure()
        run: |
          echo "### Frontend Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** prod-eu" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the workflow logs for details."

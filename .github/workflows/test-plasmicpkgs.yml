name: Test Plasmic Packages

on:
  push:
    branches: [master]
    paths:
      - 'plasmicpkgs/**'
      - '.github/workflows/test-plasmicpkgs.yml'
      - 'jest.config.js'
      - 'jest-transform-esbuild.js'
  pull_request:
    branches: [master]
    paths:
      - 'plasmicpkgs/**'
      - '.github/workflows/test-plasmicpkgs.yml'
      - 'jest.config.js'
      - 'jest-transform-esbuild.js'

jobs:
  test-jest:
    name: Jest Tests (plasmicpkgs)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run Jest tests for plasmicpkgs
        env:
          CI: true
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: yarn jest --testPathPattern='plasmicpkgs/' --testPathIgnorePatterns='plasmicpkgs/contentful' --passWithNoTests

      - name: Test Summary
        if: always()
        run: |
          echo "### Plasmicpkgs Jest Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "All Jest tests passed successfully." >> $GITHUB_STEP_SUMMARY
          else
            echo "Some Jest tests failed. Check the logs for details." >> $GITHUB_STEP_SUMMARY
          fi

  test-vitest:
    name: Vitest Tests (contentful)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run Vitest for contentful
        working-directory: plasmicpkgs/contentful
        env:
          CI: true
        run: yarn test

      - name: Test Summary
        if: always()
        run: |
          echo "### Contentful Vitest Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "All Vitest tests passed successfully." >> $GITHUB_STEP_SUMMARY
          else
            echo "Some Vitest tests failed. Check the logs for details." >> $GITHUB_STEP_SUMMARY
          fi
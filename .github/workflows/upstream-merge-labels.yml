name: Upstream Merge Labels

# Auto-add test labels when the upstream merge PR is marked ready for review.
# This triggers the full WAB and E2E test suites without manual label management.

on:
  pull_request:
    types: [ready_for_review]
    branches: [master]

permissions:
  pull-requests: write

jobs:
  add-labels:
    name: Add test labels
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'merge/upstream')

    steps:
      - name: Add CI test labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --add-label "run-wab-tests,run-e2e-tests"
          echo "Added run-wab-tests and run-e2e-tests labels to PR #${{ github.event.pull_request.number }}"

name: 'Setup Environment'
description: 'Setup Node.js and pnpm, and restore dependency caches (requires checkout first)'

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '22'
  fail-on-cache-miss:
    description: 'Fail if cache is not found'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    # Reads the version from the root package.json "packageManager" field.
    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Resolve pnpm store path
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    # The root workspace is a symlink farm, so cache the store it hardlinks from
    # rather than node_modules itself.
    - name: Restore pnpm store
      uses: actions/cache@v4
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-v1-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-v1-${{ runner.os }}-
        fail-on-cache-miss: ${{ inputs.fail-on-cache-miss }}

    - name: Restore platform dependencies and generated files
      uses: actions/cache@v4
      with:
        path: |
          platform/wab/node_modules
          platform/loader-bundle-env/node_modules
          platform/wab/src/wab/gen
          platform/wab/src/wab/shared/model/classes.ts
          platform/wab/src/wab/shared/model/classes-metas.ts
          platform/wab/src/wab/styles/_tokens.sass
          platform/wab/src/wab/styles/_tokens.ts
          platform/wab/src/wab/styles/css-variables.ts
          platform/wab/src/wab/styles/css-variables.scss
        key: deps-v5-${{ runner.os }}-${{ hashFiles('platform/**/yarn.lock') }}
        fail-on-cache-miss: ${{ inputs.fail-on-cache-miss }}

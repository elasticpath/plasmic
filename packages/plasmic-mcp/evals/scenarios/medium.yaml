            - design
            - component
            - node
      - type: tool-params
        params:
          tool: design
          action: create-token
          expected:
            name: hero-blue
      - type: existence
        params:
          entityType: token
          name: hero-blue
      - type: existence
        params:
          entityType: component
          name: HeroBanner
      - type: tool-params
        params:
          tool: node
          action: update-styles
          expected: {}
      - type: count
        params:
          min: 4
          max: 15
      - type: no-errors
        params: {}

  # ─────────────────────────────────────────────────────────────────────
  # Component + Node + Variant + Design: comprehensive component creation
  # ─────────────────────────────────────────────────────────────────────

  - id: medium-full-card
    description: "Build a complete 'ProductCard' component: 1) Create the component. 2) Add a heading that says 'Product Name' and a paragraph that says '$99.99'. 3) Add a hover style variant to the component. 4) Create a color token called 'card-bg' with value '#f8f9fa'."
    domains:
      - component
      - node
      - variant
      - design
    tier: medium
    timeout: 180
    graders:
      - type: tool-sequence
        params:
          tools:
            - component
            - node
            - variant
            - design
      - type: tool-params
        params:
          tool: component
          action: create
          expected:
            name: ProductCard
      - type: existence
        params:
          entityType: component
          name: ProductCard
      - type: existence
        params:
          entityType: token
          name: card-bg
      - type: tool-params
        params:
          tool: variant
          action: create-style
          expected: {}
      - type: count
        params:
          min: 5
          max: 20
      - type: no-errors
        params: {}

  # ─────────────────────────────────────────────────────────────────────
  # Data + Inspect: adding data queries to existing components
  # ─────────────────────────────────────────────────────────────────────

  - id: medium-add-query
    description: "List all components to find the Homepage. Then add a data query called 'fetchProducts' to the Homepage component. Finally, list queries on Homepage to verify it was added."
    domains:
      - data
      - inspect
    tier: medium
    timeout: 120
    graders:
      - type: tool-sequence
        params:
          tools:
            - component
            - data
      - type: tool-params
        params:
          tool: data
          action: add-query
          expected:
            name: fetchProducts
      - type: count
        params:
          min: 3
          max: 10
      - type: no-errors
        params: {}

  # ─────────────────────────────────────────────────────────────────────
  # Component + Node + Interaction: interactive component creation
  # ─────────────────────────────────────────────────────────────────────

  - id: medium-cta-button
    description: "Create a new reusable component called 'CTAButton'. Add a text element inside it that says 'Sign Up Now'. Then add an onClick event handler on that text element that navigates to '/signup'."

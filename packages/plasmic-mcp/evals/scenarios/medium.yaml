          tool: component
          action: create
          expected:
            name: StyledCard
      - type: existence
        params:
          entityType: component
          name: StyledCard
      - type: tool-params
        params:
          tool: node
          action: update-styles
          expected: {}
      - type: count
        params:
          min: 5
          max: 18
      - type: no-errors
        params: {}

  - id: medium-hero-with-token
    description: "Create a color token called 'hero-blue' with the value '#1a73e8'. Then create a new reusable component called 'HeroBanner'. Add a heading inside it that says 'Welcome to Our Site'. Style the heading with font size 48px and color #1a73e8."

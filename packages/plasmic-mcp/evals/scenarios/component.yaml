            - component
      - type: tool-params
        params:
          tool: component
          action: create
          expected:
            name: PropRemoveTest
      - type: tool-params
        params:
          tool: component
          action: add-prop
          expected:
            name: tempProp
      - type: tool-params
        params:
          tool: component
          action: remove-prop
          expected: {}
      - type: count
        params:
          min: 4
          max: 12
      - type: no-errors
        params: {}


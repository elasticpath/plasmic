      rubric: "Verify the TestimonialCard root element shows the card-base mixin applied in the style panel and a repeat indicator in the tree. The variant panel should list a hover style variant, the design system panel should show both the testimonial-bg token and card-base mixin, and the paragraph's property inspector should show font-size 18px and font-style italic."


          tool: design
          action: create-mixin
          expected:
            name: card-base
      - type: existence
        params:
          entityType: mixin
          name: card-base
      - type: tool-params
        params:
          tool: component
          action: create
          expected:
            name: TestimonialCard
      - type: existence
        params:
          entityType: component
          name: TestimonialCard
      - type: tool-params
        params:
          tool: node
          action: apply-mixin
          expected: {}
      - type: tool-params
        params:
          tool: variant
          action: create-style
          expected: {}
      - type: tool-params
        params:
          tool: data
          action: set-data-rep
          expected: {}
      - type: count
        params:
          min: 10
          max: 30
      - type: no-errors
        params: {}

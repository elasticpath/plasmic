      - node
      - variant
      - design
      - interaction
    tier: complex
    timeout: 240
    graders:
      - type: tool-sequence
        params:
          tools:
            - design
            - component
            - node
            - variant
            - interaction
      - type: tool-params
        params:
          tool: design
          action: create-token
          expected:
            name: form-border
      - type: existence
        params:
          entityType: token
          name: form-border
      - type: tool-params
        params:
          tool: component
          action: create
          expected:
            name: ContactForm
      - type: existence
        params:
          entityType: component
          name: ContactForm
      - type: tool-params
        params:
          tool: variant
          action: create-group
          expected:
            name: State
      - type: tool-params
        params:
          tool: interaction
          action: add
          expected:
            event: onClick
      - type: count
        params:
          min: 9
          max: 30
      - type: no-errors
        params: {}
    visual:
      rubric: "Verify the ContactForm component tree shows the 'Get in Touch' heading plus Name, Email, and Send Message text elements as children. The variant panel should list the State group with 'default' and 'submitted' options, and the Send Message element's interaction panel should show an onClick handler navigating to '/thank-you'."


# Complex end-to-end scenarios (~15)
# Multi-domain workflows spanning 4+ domains, 8+ tool calls
# Tests: comprehensive workflows that mirror real user projects
#
# Why complex tier: These scenarios test Claude's ability to orchestrate
# sophisticated multi-domain workflows that span the full STRAP surface.
# They require planning, sequencing dependent operations (create before
# style, component before variant), and maintaining context across many
# tool calls — reflecting the kind of work users actually do in Plasmic.

scenarios:
  # ─────────────────────────────────────────────────────────────────────
  # Responsive Hero Section
  # Domains: component + node + variant + design
  # Expected flow: create token → create component → add nodes → style →
  #   create screen variant → style variant
  # ─────────────────────────────────────────────────────────────────────

  - id: complex-responsive-hero
    description: >
      Build a responsive hero section for a landing page:
      1) Create a color token called 'brand-primary' with value '#1a73e8'.
      2) Create a new reusable component called 'HeroSection'.
      3) Add a heading element inside it that says 'Welcome to Our Platform'.
      4) Add a paragraph below the heading that says 'Build amazing things with our tools'.
      5) Style the heading with font size 64px, font weight bold, color #1a73e8, and text alignment center.
      6) Style the paragraph with font size 20px, color #555555, and text alignment center.
      7) Create a screen variant called 'Mobile' on HeroSection with max-width 768 pixels.
    domains:
      - component
      - node
      - variant
      - design
    tier: complex
    timeout: 240
    graders:
      - type: tool-sequence
        params:
          tools:
            - design
            - component
            - node
            - variant
      - type: tool-params
        params:
          tool: design
          action: create-token
          expected:
            name: brand-primary
      - type: existence
        params:
          entityType: token
          name: brand-primary
      - type: tool-params
        params:
          tool: component
          action: create
          expected:
            name: HeroSection
      - type: existence
        params:
          entityType: component
          name: HeroSection
      - type: tool-params
        params:
          tool: node
          action: update-styles
          expected: {}
      - type: tool-params
        params:
          tool: variant
          action: create-screen
          expected:
            name: Mobile
      - type: count
        params:
          min: 8
          max: 25
      - type: no-errors
        params: {}

  # ─────────────────────────────────────────────────────────────────────
  # Product Card with Data Binding
  # Domains: component + node + data + interaction
  # Expected flow: create component → add nodes → add query →
  #   set data rep → set dynamic text → add click handler
  # ─────────────────────────────────────────────────────────────────────

  - id: complex-product-card-data
    description: >
      Create a data-driven product card:
      1) Create a new reusable component called 'ProductCard'.
      2) Add a heading element inside it that says 'Product Name'.
      3) Add a paragraph element that says '$0.00'.
      4) Add a data query called 'fetchProducts' on the ProductCard component.
      5) Set up data repetition on the root element of ProductCard to repeat
         for each item in '$queries.fetchProducts.data', using 'product'
         as the element variable.
      6) Add an onClick event handler on the heading that performs a
         navigation action to the URL '/products'.
    domains:
      - component
      - node
      - data
      - interaction
    tier: complex
    timeout: 240
    graders:
      - type: tool-sequence
        params:
          tools:
            - component
            - node
            - data
            - interaction
      - type: tool-params
        params:
          tool: component
          action: create
          expected:
            name: ProductCard
      - type: existence
        params:
          entityType: component
          name: ProductCard
      - type: tool-params
        params:
          tool: data
          action: add-query
          expected:
            name: fetchProducts
      - type: tool-params
        params:
          tool: data
          action: set-data-rep
          expected: {}
      - type: tool-params
        params:
          tool: interaction
          action: add
          expected:
            event: onClick
      - type: count
        params:
          min: 8
          max: 28
      - type: no-errors
        params: {}


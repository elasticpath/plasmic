      7) Style the heading with font size 28px, font weight bold, and text alignment center.
      8) Create a variant group called 'State' of type 'single' with initial variants 'default' and 'submitted'.
      9) Add an onClick event handler on the 'Send Message' element that performs a navigation action to '/thank-you'.

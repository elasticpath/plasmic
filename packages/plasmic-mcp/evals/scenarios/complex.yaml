      1) Create a color token called 'nav-bg' with value '#ffffff'.
      2) Create a color token called 'nav-link' with value '#333333'.
      3) Create a new reusable component called 'NavBar'.
      4) Add a heading element inside it that says 'MyBrand'.
      5) Add a link element that says 'Home'.
      6) Add another link element that says 'About'.
      7) Style the heading with font size 24px and font weight bold.
      8) Create a hover style variant on the NavBar component.
      9) Add an onClick event handler on the 'About' link that navigates to '/about'.
    domains:
      - component
      - node
      - variant
      - design
      - interaction
    tier: complex
    timeout: 240
    graders:
      - type: tool-sequence
        params:
          tools:
            - design
            - component
            - node
            - variant
            - interaction
      - type: tool-params
        params:
          tool: design
          action: create-token
          expected:
            name: nav-bg
      - type: tool-params
        params:
          tool: design
          action: create-token
          expected:
            name: nav-link
      - type: existence
        params:
          entityType: token
          name: nav-bg
      - type: existence
        params:
          entityType: token
          name: nav-link
      - type: tool-params
        params:
          tool: component
          action: create
          expected:
            name: NavBar
      - type: existence
        params:
          entityType: component
          name: NavBar
      - type: tool-params
        params:
          tool: variant
          action: create-style
          expected: {}
      - type: tool-params
        params:
          tool: interaction
          action: add
          expected:
            event: onClick
      - type: count
        params:
          min: 10
          max: 30
      - type: no-errors
        params: {}
    visual:
      rubric: "Verify the NavBar component tree shows the brand heading and two link elements (Home, About) as siblings. The variant panel should list a hover style variant, and the About link's interaction panel should show an onClick handler. The design system panel should list both nav-bg and nav-link tokens."


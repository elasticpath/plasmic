        params:
          tool: design
          action: create-token
          expected:
            name: blog-text
      - type: existence
        params:
          entityType: token
          name: blog-text
      - type: tool-params
        params:
          tool: node
          action: update-styles
          expected: {}
      - type: tool-params
        params:
          tool: variant
          action: create-screen
          expected:
            name: Mobile
      - type: count
        params:
          min: 9
          max: 30
      - type: no-errors
        params: {}
    visual:
      rubric: "Verify the BlogPost page appears in the pages list at path /blog/post, with its tree showing a heading followed by two paragraph elements. The property inspector should show font-size 36px and font-weight bold on the heading, and the variant list should include a Mobile screen breakpoint. The blog-text token should appear in the design system panel."


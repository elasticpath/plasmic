      2) Create a new page called 'BlogPost' at the path '/blog/post'.
      3) Add a heading element that says 'Article Title'.
      4) Add a paragraph element that says 'Published on January 1, 2026'.
      5) Add another paragraph element that says 'Article body content goes here...'.
      6) Create a color token called 'blog-text' with value '#2d3748'.
      7) Style the first heading with font size 36px, font weight bold, and color #2d3748.
      8) Style the date paragraph with font size 14px and color #718096.
      9) Create a screen variant called 'Mobile' on the BlogPost page with max-width 768 pixels.
    domains:
      - component
      - node
      - design
      - variant
      - inspect
    tier: complex
    timeout: 240
    graders:
      - type: tool-sequence
        params:
          tools:
            - component
            - node
            - design
            - variant
      - type: tool-params
        params:
          tool: component
          action: create-page
          expected:
            name: BlogPost

# Data domain scenarios
# Tests: query listing, data binding inspection, query/interaction verification
#
# Why the data grader matters here: The `data` grader type queries actual project
# state to verify queries and interactions were wired up — not just that the right
# tool was called. This catches cases where Claude calls add-query with correct
# params but the query doesn't persist (e.g., wrong componentUuid).
scenarios:
  - id: data-list-queries
    description: "Show me what data queries are defined on the Homepage component. First find the Homepage, then list its queries."
    domains:
      - data
    tier: simple
    timeout: 60
    graders:
      - type: tool-sequence
        params:
          tools:
            - component
            - data
      - type: tool-params
        params:
          tool: data
          action: list-queries
          expected: {}
      - type: no-errors
        params: {}

  # ─────────────────────────────────────────────────────────────────────
  # Medium: data grader (queries) — verify query was actually added
  # Tests: data grader validates query state after add-query
  # ─────────────────────────────────────────────────────────────────────

  - id: data-verify-query
    description: "Create a new reusable component called 'DataWidget'. Then add a data query called 'fetchItems' to the DataWidget component. Finally, list queries on DataWidget to verify the query exists."
    domains:
      - data
      - component
    tier: medium
    timeout: 120
    graders:
      - type: tool-sequence
        params:
          tools:
            - component
            - data
      - type: tool-params
        params:
          tool: component
          action: create
          expected:
            name: DataWidget
      - type: existence
        params:
          entityType: component
          name: DataWidget
      - type: tool-params
        params:
          tool: data
          action: add-query
          expected:
            name: fetchItems
      - type: data
        params:
          componentName: DataWidget
          checkType: queries
          minCount: 1
      - type: count
        params:
          min: 3
          max: 12
      - type: no-errors
        params: {}
    visual:
      rubric: "Open the DataWidget component — the data queries panel should show 'fetchItems' as a configured query."

  # ─────────────────────────────────────────────────────────────────────
  # Medium: data grader (interactions) — verify handler was wired up
  # Tests: data grader validates interaction state on a specific element
  # ─────────────────────────────────────────────────────────────────────

  - id: data-verify-interaction
    description: "Create a new reusable component called 'ActionCard'. Add a text element inside it that says 'Click here'. Then add an onClick event handler on that text element that navigates to '/details'. Finally, list the interactions on that element to verify the handler exists."
    domains:
      - data
      - component
      - node
      - interaction
    tier: medium
    timeout: 150
    graders:
      - type: tool-sequence
        params:
          tools:
            - component
            - node
            - interaction
      - type: tool-params
        params:
          tool: component
          action: create
          expected:
            name: ActionCard
      - type: existence
        params:
          entityType: component
          name: ActionCard
      - type: tool-params
        params:
          tool: interaction
          action: add
          expected:
            event: onClick
      - type: count
        params:
          min: 5
          max: 18
      - type: no-errors
        params: {}
    visual:
      rubric: "Select the text element in ActionCard — the interactions panel should show an onClick handler configured to navigate to '/details'."

  # ═══════════════════════════════════════════════════════════════════════
  # P11.3 — Missing data action coverage scenarios
  # Each scenario tests a single data action that previously had zero
  # eval coverage. Covers query lifecycle, data tokens, splits, and
  # code introspection.
  # ═══════════════════════════════════════════════════════════════════════

  # ─────────────────────────────────────────────────────────────────────
  # Medium: data.update-query — modify an existing query's configuration
  # Why: Query updates are how users iterate on data fetching logic.
  # Without coverage, query modification bugs go undetected.
  # ─────────────────────────────────────────────────────────────────────

  - id: data-update-query
    description: "Create a reusable component called 'QueryUpdateTest'. Add a data query called 'fetchData' to it. Then update that query using data.update-query to rename it to 'fetchUpdatedData'."
    domains:
      - data
      - component
    tier: medium
    timeout: 120
    graders:
      - type: tool-sequence
        params:
          tools:
            - component
            - data
      - type: tool-params
        params:
          tool: component
          action: create
          expected:
            name: QueryUpdateTest
      - type: tool-params
        params:
          tool: data
          action: add-query
          expected:
            name: fetchData
      - type: tool-params
        params:
          tool: data
          action: update-query
          expected: {}
      - type: count
        params:
          min: 3
          max: 12
      - type: no-errors
        params: {}

  # ─────────────────────────────────────────────────────────────────────
  # Medium: data.remove-query — delete a query from a component
  # Why: Query cleanup prevents unused queries from accumulating.
  # Without coverage, removal failures or stale bindings go undetected.
  # ─────────────────────────────────────────────────────────────────────

  - id: data-remove-query
    description: "Create a reusable component called 'QueryRemoveTest'. Add a data query called 'tempQuery' to it. Then delete it using data.remove-query. List queries to verify it was removed."
    domains:
      - data
      - component
    tier: medium
    timeout: 120
    graders:
      - type: tool-sequence
        params:
          tools:
            - component
            - data
      - type: tool-params
        params:
          tool: component
          action: create
          expected:
            name: QueryRemoveTest
      - type: tool-params
        params:
          tool: data
          action: add-query
          expected:
            name: tempQuery
      - type: tool-params
        params:
          tool: data
          action: remove-query
          expected: {}
      - type: count
        params:
          min: 4
          max: 12
      - type: no-errors
        params: {}

  # ─────────────────────────────────────────────────────────────────────

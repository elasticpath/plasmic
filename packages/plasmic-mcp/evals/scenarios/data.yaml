        params:
          tool: data
          action: list-data-tokens
          expected: {}
      - type: no-errors
        params: {}
      - type: count
        params:
          min: 1
          max: 5

  # ─────────────────────────────────────────────────────────────────────
  # Simple: data.create-data-token — create a site-level JSON token
  # Why: Data tokens provide site-wide configuration values accessible
  # via $ctx. Without coverage, creation bugs go undetected.
  # ─────────────────────────────────────────────────────────────────────

  - id: data-create-data-token
    description: "Create a site-level data token called 'siteConfig' with a JSON value of '{\"siteName\": \"My App\"}' using data.create-data-token."
    domains:
      - data
    tier: simple
    timeout: 60
    graders:
      - type: tool-sequence
        params:
          tools:
            - data
      - type: tool-params
        params:
          tool: data
          action: create-data-token
          expected:
            name: siteConfig
      - type: no-errors
        params: {}
      - type: count
        params:
          min: 1
          max: 5

  # ─────────────────────────────────────────────────────────────────────
  # Simple: data.update-data-token — update a data token's value
  # Why: Token value updates are how site config evolves. Without
  # coverage, update failures go undetected.
  # ─────────────────────────────────────────────────────────────────────

  - id: data-update-data-token
    description: "Create a data token called 'apiUrl' with value '\"https://api.example.com/v1\"'. Then update its value to '\"https://api.example.com/v2\"' using data.update-data-token."
    domains:
      - data
    tier: simple
    timeout: 90
    graders:
      - type: tool-sequence
        params:
          tools:
            - data
      - type: tool-params
        params:
          tool: data
          action: create-data-token
          expected:
            name: apiUrl
      - type: tool-params
        params:
          tool: data
          action: update-data-token
          expected: {}
      - type: no-errors
        params: {}
      - type: count
        params:
          min: 2
          max: 8

  # ─────────────────────────────────────────────────────────────────────
  # Simple: data.remove-data-token — delete a data token
  # Why: Token cleanup prevents unused config from accumulating.
  # Without coverage, removal failures go undetected.
  # ─────────────────────────────────────────────────────────────────────

  - id: data-remove-data-token
    description: "Create a data token called 'tempToken' with value '\"temporary\"'. Then delete it using data.remove-data-token. List data tokens to verify it was removed."
    domains:
      - data
    tier: simple
    timeout: 90

# Interaction domain scenarios
# Tests: event handler listing
scenarios:
  - id: interaction-list
    description: "List all event handlers on the first interactive element in the Homepage component. First inspect the Homepage to find an element, then list its interactions."
    domains:
      - interaction
    tier: simple
    timeout: 60
    graders:
      - type: tool-sequence
        params:
          tools:
            - component
            - inspect
            - interaction
      - type: no-errors
        params: {}
      - type: count
        params:
          min: 3
          max: 10

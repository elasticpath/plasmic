# Variant domain scenarios
# Tests: listing variants, code component variants, style variant creation
scenarios:
  - id: variant-list
    description: "List all variants defined on the Homepage component. First find the Homepage component, then list its variants."
    domains:
      - variant
    tier: simple
    timeout: 60
    graders:
      - type: tool-sequence
        params:
          tools:
            - component
            - variant
      - type: tool-params
        params:
          tool: variant
          action: list
          expected: {}
      - type: no-errors
        params: {}

  # Code component variant scenarios (P4.5)
  # These test the ability to discover, resolve, and use code component variants —
  # registered variant states (e.g., Selected, Pressed) that come from code component
  # metadata rather than user-created style variants.

  - id: variant-list-code-component
    description: >
      Find a component whose root is a code component with registered variants
      (e.g., a button or trigger component). List the component's variants using
      variant.list and confirm that the response includes a codeComponentVariants
      array with entries showing the variant key, displayName, and cssSelector.
    domains:
      - variant
      - component
    tier: simple
    timeout: 60
    graders:
      - type: tool-sequence
        params:
          tools:
            - component
            - variant
      - type: tool-params
        params:
          tool: variant
          action: list
          expected: {}
      - type: no-errors
        params: {}
      - type: count
        params:
          min: 2
          max: 6

  - id: variant-resolve-code-component
    description: >
      Find a component with code component variants (registered variants from
      a code component root). List the variants to discover available code
      component variant names. Then apply styles to an element on that component
      targeting one of the code component variants by name — for example, use
      node.update-styles with the variant parameter set to the code component
      variant's key or displayName (e.g., "selected" or "Selected") to set
      a background color on the root element for that variant state.
    domains:
      - variant
      - node
      - component
      - inspect
    tier: medium
    timeout: 90
    graders:
      - type: tool-sequence
        params:
          tools:
            - component
            - variant
            - node
      - type: tool-params
        params:
          tool: variant
          action: list
          expected: {}
      - type: tool-params
        params:
          tool: node
          action: update-styles
          expected: {}
      - type: no-errors
        params: {}
      - type: count
        params:
          min: 4
          max: 15
    visual:
      rubric: "Verify the component's variant list includes code component variants with keys and display names. The style inspector for the targeted element should show variant-specific styles applied under the selected code component variant state."

  - id: variant-create-style-code-component
    description: >
      Build variant-specific styles using a code component's registered CSS
      selectors. Steps:
      1) Find a component whose root is a code component with registered variants.
      2) List the component's variants to discover code component variants and
         their CSS selectors (e.g., [data-selected], [data-pressed]).
      3) Create a new style variant on the component using variant.create-style
         with the selector set to one of the discovered code component CSS
         selectors (e.g., selector: "[data-selected]").
      4) Apply styles to the root element targeting the newly created style
         variant (e.g., set backgroundColor to a highlight color).
      5) List variants again to confirm the new style variant was created.
    domains:
      - variant
      - node
      - component
      - inspect
    tier: complex
    timeout: 120
    graders:
      - type: tool-sequence
        params:
          tools:
            - component
            - variant
            - node
      - type: tool-params
        params:
          tool: variant
          action: list
          expected: {}
      - type: tool-params
        params:
          tool: variant
          action: create-style
          expected: {}
      - type: tool-params
        params:
          tool: node
          action: update-styles
          expected: {}
      - type: no-errors
        params: {}
      - type: count
        params:
          min: 6
          max: 20
    visual:
      rubric: "Verify the component's variant panel shows a new style variant created with the code component's CSS selector. The style inspector should show variant-specific styles applied to the root element under that variant state. The variant list should show both the original code component variants and the newly created style variant."

  # ═══════════════════════════════════════════════════════════════════════
  # P11.5 — Missing variant action coverage scenarios
  # Each scenario tests a single variant action that previously had zero
  # eval coverage. Covers global groups, screen updates, renaming, removal.
  # ═══════════════════════════════════════════════════════════════════════

  # ─────────────────────────────────────────────────────────────────────
  # Simple: variant.list-global-groups — list global variant groups
  # Why: Global group discovery is needed before managing site-level
  # variants. Without coverage, listing bugs go undetected.
  # ─────────────────────────────────────────────────────────────────────

  - id: variant-list-global-groups
    description: "List all global variant groups defined in the project using variant.list-global-groups."
    domains:
      - variant
    tier: simple
    timeout: 60
    graders:
      - type: tool-sequence
        params:
          tools:
            - variant
      - type: tool-params
        params:
          tool: variant
          action: list-global-groups
          expected: {}
      - type: no-errors
        params: {}
      - type: count
        params:
          min: 1
          max: 5

  # ─────────────────────────────────────────────────────────────────────
  # Simple: variant.create-global-group — create a global variant group
  # Why: Global groups enable site-wide variant toggling (e.g., Theme).
  # Without coverage, group creation bugs go undetected.
  # ─────────────────────────────────────────────────────────────────────

  - id: variant-create-global-group
    description: "Create a global variant group called 'Theme' with type 'single' and initial variants 'Light' and 'Dark' using variant.create-global-group."
    domains:
      - variant
    tier: simple
    timeout: 60
    graders:
      - type: tool-sequence
        params:
          tools:
            - variant
      - type: tool-params
        params:
          tool: variant
          action: create-global-group
          expected:
            name: Theme
      - type: no-errors
        params: {}
      - type: count
        params:
          min: 1
          max: 5

  # ─────────────────────────────────────────────────────────────────────
  # Simple: variant.add-global — add a variant to a global group
  # Why: Adding variants to groups is how the design system grows.
  # Without coverage, variant addition bugs go undetected.
  # ─────────────────────────────────────────────────────────────────────

  - id: variant-add-global
    description: "Create a global variant group called 'Density' with type 'single' and initial variant 'Default'. Then add a new variant called 'Compact' to the 'Density' group using variant.add-global."
    domains:
      - variant
    tier: simple
    timeout: 90
    graders:
      - type: tool-sequence
        params:
          tools:
            - variant
      - type: tool-params
        params:
          tool: variant
          action: create-global-group
          expected:
            name: Density
      - type: tool-params
        params:
          tool: variant
          action: add-global
          expected:
            name: Compact
      - type: no-errors
        params: {}
      - type: count
        params:
          min: 2
          max: 8

  # ─────────────────────────────────────────────────────────────────────
  # Simple: variant.remove-global-group — delete a global variant group
  # Why: Group removal is needed for design system cleanup. Without
  # coverage, removal failures or stale refs go undetected.
  # ─────────────────────────────────────────────────────────────────────

  - id: variant-remove-global-group
    description: "Create a global variant group called 'TempGroup' with type 'single' and initial variant 'Default'. Then delete the entire group using variant.remove-global-group. List global groups to verify it was removed."
    domains:
      - variant
    tier: simple
    timeout: 90
    graders:
      - type: tool-sequence
        params:
          tools:
            - variant
      - type: tool-params
        params:
          tool: variant
          action: create-global-group
          expected:
            name: TempGroup
      - type: tool-params
        params:
          tool: variant
          action: remove-global-group
          expected: {}
      - type: no-errors
        params: {}
      - type: count
        params:
          min: 3
          max: 8

  # ─────────────────────────────────────────────────────────────────────
  # Simple: variant.rename-global — rename a global variant
  # Why: Variant renaming is needed for design system maintenance.
  # Without coverage, rename failures go undetected.
  # ─────────────────────────────────────────────────────────────────────

  - id: variant-rename-global
    description: "Create a global variant group called 'Mode' with type 'single' and initial variants 'OldName'. Then rename the 'OldName' variant to 'NewName' using variant.rename-global."
    domains:
      - variant
    tier: simple
    timeout: 90
    graders:
      - type: tool-sequence
        params:
          tools:
            - variant
      - type: tool-params
        params:
          tool: variant
          action: create-global-group
          expected:
            name: Mode
      - type: tool-params
        params:
          tool: variant
          action: rename-global
          expected:
            newName: NewName
      - type: no-errors
        params: {}
      - type: count
        params:
          min: 2
          max: 8

  # ─────────────────────────────────────────────────────────────────────
  # Simple: variant.update-screen — update a screen variant breakpoint
  # Why: Responsive breakpoint tuning is how designers adapt layouts.
  # Without coverage, breakpoint update bugs go undetected.
  # ─────────────────────────────────────────────────────────────────────

  - id: variant-update-screen
    description: "Create a screen variant called 'Tablet' with maxWidth 1024. Then update it using variant.update-screen to change the maxWidth to 900."
    domains:
      - variant
    tier: simple
    timeout: 90
    graders:
      - type: tool-sequence
        params:
          tools:
            - variant
      - type: tool-params
        params:
          tool: variant
          action: create-screen
          expected:
            maxWidth: 1024
      - type: tool-params
        params:
          tool: variant
          action: update-screen
          expected: {}
      - type: no-errors
        params: {}
      - type: count
        params:
          min: 2
          max: 8

  # ─────────────────────────────────────────────────────────────────────
  # Medium: variant.rename — rename a style variant
  # Why: Variant renaming is needed for component maintenance.
  # Without coverage, rename failures go undetected.
  # ─────────────────────────────────────────────────────────────────────

  - id: variant-rename
    description: "Create a new reusable component called 'RenameVarTest'. Create a style variant on it using variant.create-style with selector ':hover'. Then rename that variant to 'HoverState' using variant.rename."
    domains:
      - variant
      - component
    tier: medium
    timeout: 120
    graders:
      - type: tool-sequence
        params:
          tools:
            - component
            - variant
      - type: tool-params
        params:
          tool: component
          action: create
          expected:
            name: RenameVarTest
      - type: tool-params
        params:
          tool: variant
          action: create-style
          expected: {}
      - type: tool-params
        params:
          tool: variant
          action: rename
          expected:
            newName: HoverState
      - type: count
        params:
          min: 3
          max: 12
      - type: no-errors
        params: {}

  # ─────────────────────────────────────────────────────────────────────
  # Medium: variant.remove — remove a style variant
  # Why: Variant removal must cleanly unbind variant settings. Without
  # coverage, dangling variant references go undetected.
  # ─────────────────────────────────────────────────────────────────────

  - id: variant-remove
    description: "Create a new reusable component called 'RemoveVarTest'. Create a style variant on it using variant.create-style with selector ':focus'. Then remove that variant using variant.remove. List variants to verify it was removed."
    domains:
      - variant
      - component
    tier: medium
    timeout: 120
    graders:
      - type: tool-sequence
        params:
          tools:
            - component
            - variant
      - type: tool-params
        params:
          tool: component
          action: create
          expected:
            name: RemoveVarTest
      - type: tool-params
        params:
          tool: variant
          action: create-style
          expected: {}
      - type: tool-params
        params:
          tool: variant
          action: remove
          expected: {}
      - type: count
        params:
          min: 4
          max: 12
      - type: no-errors
        params: {}

# Design domain scenarios
# Tests: token lifecycle, mixin management, animation sequences, themes, asset management
#
# Why comprehensive design coverage matters: The design domain controls the entire
# design system (tokens, mixins, animations, themes, assets). Without scenarios for
# each CRUD operation, regressions in token deletion, mixin updates, theme switching,
# or asset management would go completely undetected by the eval system.
scenarios:
  - id: design-list-tokens
    description: "List all color tokens defined in the project's design system."
    domains:
      - design
    tier: simple
    timeout: 60
    graders:
      - type: tool-sequence
        params:
          tools:
            - design
      - type: tool-params
        params:
          tool: design
          action: list-tokens
          expected: {}
      - type: no-errors
        params: {}
      - type: count
        params:
          min: 1
          max: 5

  # ═══════════════════════════════════════════════════════════════════════
  # P11.2 — Missing design action coverage scenarios
  # ═══════════════════════════════════════════════════════════════════════

  # ─────────────────────────────────────────────────────────────────────
  # Simple: design.remove-token — delete an existing token
  # Why: Token cleanup is part of design system hygiene. Without
  # coverage, stale token references or removal failures go undetected.
  # ─────────────────────────────────────────────────────────────────────

  - id: design-remove-token
    description: "Create a color token called 'TempColor' with value '#ff00ff'. Then delete it using design.remove-token. Finally, list tokens to verify it was removed."
    domains:
      - design
    tier: simple
    timeout: 90
    graders:
      - type: tool-sequence
        params:
          tools:
            - design
      - type: tool-params
        params:
          tool: design
          action: create-token
          expected:
            name: TempColor
      - type: tool-params
        params:
          tool: design
          action: remove-token
          expected: {}
      - type: no-errors
        params: {}
      - type: count
        params:
          min: 3
          max: 8

  # ─────────────────────────────────────────────────────────────────────
  # Simple: design.duplicate-token — copy an existing token
  # Why: Duplicating tokens is a common workflow when creating
  # variations. Without coverage, deep-copy bugs go undetected.
  # ─────────────────────────────────────────────────────────────────────

  - id: design-duplicate-token
    description: "Create a color token called 'BaseColor' with value '#3366cc'. Then duplicate it using design.duplicate-token. List tokens to verify both exist."
    domains:
      - design
    tier: simple
    timeout: 90
    graders:
      - type: tool-sequence
        params:
          tools:
            - design
      - type: tool-params
        params:
          tool: design
          action: create-token
          expected:
            name: BaseColor
      - type: tool-params
        params:
          tool: design
          action: duplicate-token
          expected: {}
      - type: no-errors
        params: {}
      - type: count
        params:
          min: 3
          max: 8


      - type: tool-params
        params:
          tool: design
          action: create-mixin
          expected:
            name: EditMixin
      - type: tool-params
        params:
          tool: design
          action: update-mixin
          expected: {}
      - type: no-errors
        params: {}
      - type: count
        params:
          min: 2
          max: 8

  # ─────────────────────────────────────────────────────────────────────
  # Simple: design.remove-mixin — delete a style mixin
  # Why: Mixin deletion must cleanly remove references. Without
  # coverage, dangling mixin references could cause rendering errors.
  # ─────────────────────────────────────────────────────────────────────

  - id: design-remove-mixin
    description: "Create a style mixin called 'TempMixin' with opacity '0.5'. Then delete it using design.remove-mixin. List mixins to confirm it was removed."
    domains:
      - design
    tier: simple

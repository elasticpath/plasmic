  # ─────────────────────────────────────────────────────────────────────
  # Simple: design.update-mixin — modify styles on an existing mixin
  # Why: Mixin updates propagate to all elements using the mixin.
  # Without coverage, update failures or stale values go undetected.
  # ─────────────────────────────────────────────────────────────────────

  - id: design-update-mixin
    description: "Create a style mixin called 'EditMixin' with border-radius '4px'. Then update it using design.update-mixin to change border-radius to '12px' and add padding-top '16px'."
    domains:
      - design
    tier: simple

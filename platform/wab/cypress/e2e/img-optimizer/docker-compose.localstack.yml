version: '3.8'

services:
  localstack:
    image: localstack/localstack:latest
    container_name: wab-test-localstack
    ports:
      - "4566:4566"            # LocalStack gateway
      - "4510-4559:4510-4559"  # External services port range
    environment:
      # Services to enable
      - SERVICES=s3
      # Enable debug logging
      - DEBUG=1
      # Disable persistence to start fresh each time
      - PERSISTENCE=0
      # LocalStack configuration
      - DOCKER_HOST=unix:///var/run/docker.sock
      - LOCALSTACK_HOST=localstack
    volumes:
      # Mount Docker socket for container access
      - "/var/run/docker.sock:/var/run/docker.sock"
      # Persist data between restarts (optional)
      - "./tmp/localstack:/var/lib/localstack"
    networks:
      - wab-test

  # S3 bucket initializer
  s3-init:
    image: amazon/aws-cli:latest
    container_name: wab-test-s3-init
    depends_on:
      - localstack
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://localstack:4566
    entrypoint: /bin/sh -c
    command: |
      "
      echo '⏳ Waiting for LocalStack to be ready...'
      sleep 10
      
      echo '🪣 Creating S3 bucket...'
      aws s3 mb s3://test-bucket
      
      echo '🔧 Setting bucket policy for public read access...'
      aws s3api put-bucket-policy --bucket test-bucket --policy '{
        \"Version\": \"2012-10-17\",
        \"Statement\": [{
          \"Effect\": \"Allow\",
          \"Principal\": \"*\",
          \"Action\": \"s3:GetObject\",
          \"Resource\": \"arn:aws:s3:::test-bucket/*\"
        }]
      }'
      
      echo '✅ S3 bucket configured successfully!'
      echo '📋 Ready for image optimizer testing'
      
      # Keep container running
      tail -f /dev/null
      "
    networks:
      - wab-test

networks:
  wab-test:
    driver: bridge